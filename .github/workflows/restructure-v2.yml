name: Restructure repository v2

# One-time migration runner; kept for manual recovery/re-runs.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restructure-v2.yml"
      - "scripts/migrate/restructure_v2.py"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository migration
        run: python scripts/migrate/restructure_v2.py

      - name: Commit restructured repository
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: adopt scalable visual asset architecture v2"
          git push
